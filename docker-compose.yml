services:
  ayet-hadis-bot:
    build: .
    restart: unless-stopped
    environment:
      CONTENT_INTERVAL: ${CONTENT_INTERVAL:-4h}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
      QURAN_EDITION: ${QURAN_EDITION:-quran-uthmani}
      HADITH_EDITION: ${HADITH_EDITION:-eng-bukhari}
      QURAN_VERSE_NUMBER: ${QURAN_VERSE_NUMBER:-1}
      HADITH_NUMBER: ${HADITH_NUMBER:-1}
