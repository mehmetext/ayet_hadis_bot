services:
  ayet-hadis-bot:
    build: .
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Istanbul}
      SEND_WINDOW_START: ${SEND_WINDOW_START:-06:30}
      SEND_WINDOW_END: ${SEND_WINDOW_END:-22:30}
      DAILY_NOTIFICATION_COUNT: ${DAILY_NOTIFICATION_COUNT:-4}
      DATA_DIR: /data
    volumes:
      - bot-data:/data

volumes:
  bot-data:
