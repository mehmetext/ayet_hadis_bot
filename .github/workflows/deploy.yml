name: Build and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          CONSOLE_LANGUAGE: ${{ vars.CONSOLE_LANGUAGE }}
          SEND_WINDOW_START: ${{ vars.SEND_WINDOW_START }}
          SEND_WINDOW_END: ${{ vars.SEND_WINDOW_END }}
          DAILY_NOTIFICATION_COUNT: ${{ vars.DAILY_NOTIFICATION_COUNT }}
          HTTP_TIMEOUT_SECONDS: ${{ vars.HTTP_TIMEOUT_SECONDS }}
          DATA_DIR: ${{ vars.DATA_DIR }}
        run: |
          set -eu
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TIMEZONE"
          test -n "$CONSOLE_LANGUAGE"
          test -n "$SEND_WINDOW_START"
          test -n "$SEND_WINDOW_END"
          test -n "$DAILY_NOTIFICATION_COUNT"
          test -n "$HTTP_TIMEOUT_SECONDS"
          test -n "$DATA_DIR"
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i "$HOME/.ssh/deploy_key" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          {
            printf 'TIMEZONE=%s\n' "$TIMEZONE"
            printf 'CONSOLE_LANGUAGE=%s\n' "$CONSOLE_LANGUAGE"
            printf 'SEND_WINDOW_START=%s\n' "$SEND_WINDOW_START"
            printf 'SEND_WINDOW_END=%s\n' "$SEND_WINDOW_END"
            printf 'DAILY_NOTIFICATION_COUNT=%s\n' "$DAILY_NOTIFICATION_COUNT"
            printf 'HTTP_TIMEOUT_SECONDS=%s\n' "$HTTP_TIMEOUT_SECONDS"
            printf 'DATA_DIR=%s\n' "$DATA_DIR"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
          } | ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > '$DEPLOY_PATH/.env.tmp' && mv '$DEPLOY_PATH/.env.tmp' '$DEPLOY_PATH/.env'"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans"
